listen: 0.0.0.0:4000

supergraph:
  # Path to supergraph schema
  path: /etc/router/supergraph.graphql

# Health check configuration
health_check:
  enabled: true
  path: /health
  # Include subgraph connectivity in health checks
  listen: 0.0.0.0:4000

# Subgraph configuration for schema polling and health checks
subgraphs:
  products:
    routing_url: ${env.PRODUCTS_SERVICE_URL}/graphql
    schema:
      subgraph_url: ${env.PRODUCTS_SERVICE_URL}/graphql
      # Poll for schema updates every 30 seconds
      poll_interval: 30s
      # Timeout for schema polling requests
      timeout: 10s
    # Health check configuration for Products service
    health_check:
      enabled: true
      path: /health
      interval: 30s
      timeout: 5s
  
  ratings:
    routing_url: ${env.RATINGS_SERVICE_URL}/graphql
    schema:
      subgraph_url: ${env.RATINGS_SERVICE_URL}/graphql
      # Poll for schema updates every 30 seconds
      poll_interval: 30s
      # Timeout for schema polling requests
      timeout: 10s
    # Health check configuration for Ratings service
    health_check:
      enabled: true
      path: /health
      interval: 30s
      timeout: 5s

# CORS configuration for development
cors:
  origins:
    - "*"
  allow_credentials: true

# Request/response configuration
limits:
  max_depth: 100
  max_height: 200
  max_aliases: 30

# Error handling and retry configuration
traffic_shaping:
  # Global timeout for all requests
  timeout: 30s
  # Retry configuration for subgraph requests
  retry:
    min_per_sec: 10
    ttl: 10s
  # Rate limiting
  rate_limit:
    capacity: 1000
    interval: 1s

# Subgraph error handling
subgraph_error_redaction:
  # Don't redact errors in development
  enabled: false

# Logging and telemetry configuration
telemetry:
  apollo:
    # Disable Apollo Studio reporting for local development
    schema_reporting:
      enabled: false
    usage_reporting:
      enabled: false
  
  tracing:
    trace_config:
      service_name: graphql-gateway
  
  # Enhanced logging for subgraph connectivity
  instrumentation:
    events:
      router:
        # Log router lifecycle events
        request: info
        response: info
        error: error
      supergraph:
        # Log supergraph composition events
        request: info
        response: info
        error: error
      subgraph:
        # Log subgraph connectivity and polling
        request: info
        response: info
        error: error